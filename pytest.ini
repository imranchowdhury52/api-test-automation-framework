[pytest]
testpaths = tests
addopts = -ra
markers =
    smoke: fast checks of the most important endpoints
    regression: full regression coverage
    negative: invalid input and error handling
    auth: authentication handling
    schema: response schema validation

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s level=%(levelname)s logger=%(name)s %(message)s
log_cli_date_format = %Y-%m-%dT%H:%M:%S
log_file = reports/test_run.log
log_file_level = DEBUG
log_file_date_format = %Y-%m-%dT%H:%M:%S
log_file_format = %(asctime)s level=%(levelname)s logger=%(name)s %(message)s
